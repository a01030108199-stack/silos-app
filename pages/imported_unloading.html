<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كشف تفريغ كميات الحبوب المستوردة الواردة — نظام إدارة الصوامع</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  .unloading-header {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    color: #333;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    border-top: 5px solid var(--blue);
    page-break-inside: avoid;
  }
  .doc-title {
    text-align: center;
    font-weight: bold;
    font-size: 1.3rem;
    margin-bottom: 5px;
    color: #111;
  }
  .doc-sub {
    text-align: center;
    font-weight: bold;
    font-size: 1rem;
    margin-bottom: 20px;
    color: #444;
  }
  .header-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .hg-item {
    display: flex;
    align-items: center;
    border: 1px solid #ccc;
    background: #fdfdfd;
  }
  .hg-label {
    background: #eee;
    padding: 4px 10px;
    font-weight: 700;
    border-left: 1px solid #ccc;
    white-space: nowrap;
    min-width: 80px;
    font-size: 0.9rem;
  }
  .hg-val {
    padding: 4px 8px;
    flex: 1;
    font-weight: bold;
    color: #111;
  }
  .table-container {
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    overflow-x: auto;
    page-break-inside: avoid;
    margin-bottom: 30px;
  }
  .excel-table {
    width: 100%;
    border-collapse: collapse;
    color: #111;
    font-size: 0.85rem;
    min-width: 1200px;
  }
  .excel-table th, .excel-table td {
    border: 1px solid #000;
    text-align: center;
    padding: 6px 4px;
    vertical-align: middle;
  }
  .excel-table th {
    background: #eee;
    font-weight: 800;
    padding: 10px 4px;
  }
  .col-yellow { background: #fffbe6 !important; }
  .table-footer td { background: #fdfdfd; font-weight: bold; }
  
  @media print {
    .sidebar, .top-header, .report-header { display: none !important; }
    .main-content { margin: 0 !important; padding: 0 !important; }
    body { background: #fff; }
    .print-area { margin: 0; padding: 0; }
    .unloading-header { box-shadow: none; border-top: none; }
    .table-container { box-shadow: none; margin-bottom: 15px; }
  }
  
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, var(--bg-card), var(--bg-dark));
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  .report-header h2 { margin: 0 0 5px 0; color: #fff; }
  .report-header .sub { color: var(--text-sec); font-size: 0.9rem; }
  
  .date-nav {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--bg-body);
    padding: 10px 20px;
    border-radius: 30px;
  }
  .date-nav button {
    background: var(--blue);
    color: #fff;
    border: none;
    width: 35px; height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .date-nav input[type="date"] {
    background: transparent;
    border: none;
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--text-primary);
    outline: none;
    font-family: inherit;
  }
  .date-nav input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
    opacity: 0.8;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../js/firebase-db.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="app-sidebar"></aside>

  <main class="main-content">
    <header class="top-header no-print">
      <div>
        <div class="header-title">إدارة الاستلام والتخزين</div>
        <div class="header-sub">كشف تفريغ المستورد المؤتمت</div>
      </div>
      <div class="header-actions" style="display: flex; align-items: center; gap: 10px;">
        <button class="btn btn-success no-print" onclick="shareWhatsApp(this)" title="تصوير للواتساب"><i class="fa-brands fa-whatsapp"></i> واتساب</button>
        <button class="btn btn-primary no-print" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الكشف</button>
        <a href="reception.html" class="btn btn-outline btn-sm no-print">عودة <i class="fa-solid fa-arrow-left"></i></a>
      </div>
    </header>

    <div class="page-content">

      <!-- Date Navigator -->
      <div class="report-header no-print">
        <div>
          <h2><i class="fa-solid fa-calendar-days"></i> كشوف يوميات تفريغ المستورد</h2>
          <div class="sub">يتم تجميع البيانات وإصدار الكشوف تلقائياً حسب اسم الباخرة</div>
        </div>
        <div class="date-nav">
          <button onclick="changeDay(-1)"><i class="fa-solid fa-chevron-right"></i></button>
          <input type="date" id="navDate" onchange="loadReport()">
          <button onclick="changeDay(1)"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
      </div>

      <div class="print-area" id="reportsContainer">
        <!-- Generated Reports will go here -->
      </div>

    </div>
  </main>
</div>

<script src="../js/data.js?v=12"></script>
<script src="../js/app.js?v=12"></script>
<script>
const user = Auth.require(['security', 'scale', 'manager', 'general_admin']);
buildSidebar('reception');

let currentDate = '';

function init() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  currentDate = `${yyyy}-${mm}-${dd}`;
  document.getElementById('navDate').value = currentDate;
  loadReport();
}

function changeDay(delta) {
  let d = new Date(currentDate);
  d.setDate(d.getDate() + delta);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  currentDate = `${yyyy}-${mm}-${dd}`;
  document.getElementById('navDate').value = currentDate;
  loadReport();
}

function parseTicketDate(ts) {
  if (!ts) return '';
  let d = ts.replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x));
  d = d.replace(/[^\d\/\-\.\s:]/g, '');
  let m = d.match(/(\d{1,4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,4})/);
  if (!m) return '';
  let p1 = m[1], p2 = m[2], p3 = m[3];
  if (p1.length === 4) return p1 + '-' + p2.padStart(2,'0') + '-' + p3.padStart(2,'0');
  return p3 + '-' + p2.padStart(2,'0') + '-' + p1.padStart(2,'0');
}

function getArabicDayName(dateStr) {
  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const d = new Date(dateStr);
  return days[d.getDay()];
}

function loadReport() {
  currentDate = document.getElementById('navDate').value;
  const container = document.getElementById('reportsContainer');
  container.innerHTML = ''; // Clear existing
  
  const tickets = JSON.parse(localStorage.getItem('WEIGHBRIDGE_TICKETS') || '[]');
  
  // 1. Filter Tickets
  const dailyTickets = tickets.filter(t => {
    if (t.silo_id !== user.silo_id) return false;
    if (t.opType !== 'وارد' || t.grainType !== 'مستورد') return false;
    if (t.status !== 'completed' && t.status !== 'gate_out') return false;
    
    let tIsoDate = t.dateStr || parseTicketDate(t.timestamp);
    return tIsoDate === currentDate;
  });

  if (dailyTickets.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 50px; background: #fff; border-radius: 8px; color: #111;">
      <h2>لا توجد كارتات مستورد واردة في هذا التاريخ</h2>
      <p>لن يتم إنشاء كشوف تفريغ.</p>
    </div>`;
    return;
  }

  // 2. Group by Ship Name
  const groupedByShip = {};
  dailyTickets.forEach(t => {
    const ship = t.shipName && t.shipName.trim() !== '' ? t.shipName.trim() : 'غير محدد';
    if (!groupedByShip[ship]) {
      groupedByShip[ship] = {
        port: t.supplierName || '',
        wheatType: t.wheatType || '',
        voyageDate: t.shippingDate || '',
        tickets: []
      };
    }
    groupedByShip[ship].tickets.push(t);
  });

  // 3. Render each ship as a separate document
  const dayName = getArabicDayName(currentDate);
  const siloName = user.name.includes('صومعة') ? user.name : 'صومعة ' + user.name;
  
  Object.keys(groupedByShip).forEach(shipName => {
    const group = groupedByShip[shipName];
    
    // Sort tickets by timestamp
    group.tickets.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
    
    let rowsHtml = '';
    let tSh = 0, tRc = 0, tDef = 0, tExc = 0;
    
    group.tickets.forEach((tk, idx) => {
      const sh = parseFloat(tk.shippedWeight) || 0;
      const rc = parseFloat((tk.net / 1000).toFixed(3)) || 0;
      
      let deficit = 0, excess = 0;
      if (sh > 0 && rc > 0) {
        if (sh > rc) deficit = sh - rc;
        else excess = rc - sh;
      }
      
      tSh += sh;
      tRc += rc;
      tDef += deficit;
      tExc += excess;
      
      rowsHtml += `
        <tr>
          <td style="font-weight:bold">${idx+1}</td>
          <td>${tk.shippingDate || ''}</td>
          <td>${currentDate}</td>
          <td>${tk.transportCompany || ''}</td>
          <td>${tk.id}</td>
          <td>${tk.ticketNum || ''}</td>
          <td>${tk.driver || ''}</td>
          <td>${tk.plate || ''}</td>
          <td class="col-yellow fw-bold">${sh > 0 ? sh.toFixed(3) : '-'}</td>
          <td class="col-yellow fw-bold">${rc > 0 ? rc.toFixed(3) : '-'}</td>
          <td>${deficit > 0 ? deficit.toFixed(3) : '-'}</td>
          <td>${excess > 0 ? excess.toFixed(3) : '-'}</td>
        </tr>
      `;
    });
    
    const docHtml = `
      <div style="page-break-after: always;">
        <div class="unloading-header">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold; font-size:0.9rem">
            <div>وزارة التموين والتجارة الداخلية<br>قطاع الاستلام والتخزين والتسويق المحلي</div>
            <div style="text-align:left">
              نموذج<br>رقم (SF 8-05-B-09)<br>
              <span style="font-size:0.7rem; color:#666">رقم الإصدار: 1 | تاريخ الإصدار: 1/1/2023 | رقم الصفحة: 1</span>
            </div>
          </div>

          <div class="doc-title">كشف تفريغ كميات الحبوب المستوردة الواردة عن يوم <span style="border-bottom:1px solid #000; padding:0 10px; display:inline-block; min-width:80px;">${dayName}</span></div>
          
          <div class="header-grid" style="margin-top:20px">
            <div class="hg-item" style="grid-column: 1 / 3">
              <div class="hg-label">صومعة</div>
              <div class="hg-val">${siloName}</div>
            </div>
            <div class="hg-item" style="grid-column: 3 / 5">
              <div class="hg-label">الموافق</div>
              <div class="hg-val">${currentDate}</div>
            </div>

            <div class="hg-item" style="grid-column: 1 / 3">
              <div class="hg-label">اسم الباخرة</div>
              <div class="hg-val text-primary">${shipName}</div>
            </div>
            <div class="hg-item" style="grid-column: 3 / 5">
              <div class="hg-label">نوع الحبوب</div>
              <div class="hg-val">قمح ${group.wheatType}</div>
            </div>

            <div class="hg-item" style="grid-column: 1 / 3">
              <div class="hg-label">تاريخ الرحلة</div>
              <div class="hg-val">${group.voyageDate}</div>
            </div>
            <div class="hg-item" style="grid-column: 3 / 5">
              <div class="hg-label">الميناء</div>
              <div class="hg-val">${group.port}</div>
            </div>
          </div>
        </div>

        <div class="table-container">
          <table class="excel-table">
            <thead>
              <tr>
                <th rowspan="2" style="width: 40px">م</th>
                <th colspan="2">تاريخ</th>
                <th rowspan="2" style="width: 12%">الشركة الناقلة</th>
                <th colspan="2">رقم الكارتة</th>
                <th rowspan="2" style="width: 15%">اسم السائق</th>
                <th rowspan="2" style="width: 12%">رقم السيارة</th>
                <th colspan="2">الكمية / طن</th>
                <th colspan="2">الفرق / طن</th>
              </tr>
              <tr>
                <th style="width: 80px">الشحن</th>
                <th style="width: 80px">الاستلام</th>
                <th style="width: 10%">الاستلام</th>
                <th style="width: 10%">الشحن</th>
                <th style="width: 90px">المشحونة</th>
                <th style="width: 90px">المستلمة</th>
                <th style="width: 80px">العجز</th>
                <th style="width: 80px">الزيادة</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
              <tr class="table-footer">
                <td colspan="8">الإجمالي</td>
                <td class="col-yellow">${tSh.toFixed(3)}</td>
                <td class="col-yellow">${tRc.toFixed(3)}</td>
                <td>${tDef.toFixed(3)}</td>
                <td>${tExc.toFixed(3)}</td>
              </tr>
            </tbody>
          </table>
          <div style="margin-top: 30px; display: flex; justify-content: space-around; font-weight: bold; font-size: 1.1rem; color: #111;">
            <div>أمين العهدة<br><br>......................</div>
            <div>رئيس لجنة الاستلام<br><br>......................</div>
            <div>مدير الصومعة<br><br>......................</div>
          </div>
        </div>
      </div>
    `;
    container.innerHTML += docHtml;
  });
}

init();
</script>
<script src="../js/whatsapp.js?v=2"></script>
</body>
</html>
