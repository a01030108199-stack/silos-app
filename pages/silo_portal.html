<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الصومعة الداخلية — نظام إدارة الصوامع</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  
  body.portal-page {
    background: #0f1623;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
  }
  
  .image-map-container {
    position: relative;
    width: 100vw;
    max-width: 1400px;
  }
  
  .bg-image {
    width: 100%;
    height: auto;
    display: block;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8);
  }
  
  .click-area {
    position: absolute;
    cursor: pointer;
    border-radius: 6%;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0);
  }
  
  .click-area:hover {
    background: rgba(255, 255, 255, 0.05);
    box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.3);
    transform: scale(1.02);
  }

  /* Exact Positions based on the 2:1 image */
  /* Top Row (RTL ordering in mind, but coordinates are left-to-right) */
  /* Left to Right: Finance, Security, Reception, Manager */
  .area-finance { top: 31%; left: 14.5%; width: 15.5%; height: 30%; }
  .area-security { top: 31%; left: 32%; width: 16%; height: 30%; }
  .area-reception { top: 31%; left: 51%; width: 16%; height: 30%; }
  .area-manager { top: 31%; left: 69%; width: 16.5%; height: 30%; }
  
  /* Bottom Row */
  .area-maintenance { top: 66%; left: 69%; width: 16.5%; height: 23%; }

  /* Auth Modal */
  .auth-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,13,20,0.85); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .auth-modal-overlay.active { opacity: 1; pointer-events: all; }
  
  .auth-modal {
    background: #202b40; border-radius: 25px; padding: 40px; width: 100%; max-width: 420px;
    transform: scale(0.9); transition: transform 0.3s;
    box-shadow: 
        inset 0 0 0 2px var(--color),
        0 25px 50px -12px rgba(0,0,0,0.8),
        0 0 30px rgba(var(--color-rgb), 0.2);
  }
  .auth-modal-overlay.active .auth-modal { transform: scale(1); }
  
  .auth-modal-header { text-align: center; margin-bottom: 30px; }
  .auth-modal-icon {
    width: 70px; height: 70px; border-radius: 50%;
    background: #172033; display: flex; align-items: center; justify-content: center;
    font-size: 2rem; margin: 0 auto 20px; color: var(--color);
    box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5), inset -2px -2px 4px rgba(255,255,255,0.05);
  }
  .auth-modal h2 { color: #fff; margin: 0; font-size: 1.6rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); font-family: 'Cairo', sans-serif;}
  
  .auth-form-group { margin-bottom: 25px; }
  .auth-input {
    width: 100%; background: #172033; border: none; border-radius: 12px; padding: 18px;
    color: #fff; font-size: 1.2rem; text-align: center; letter-spacing: 5px;
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.6), inset -2px -2px 4px rgba(255,255,255,0.03);
    transition: all 0.3s; font-family: 'Cairo', sans-serif;
  }
  .auth-input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--color), inset 3px 3px 6px rgba(0,0,0,0.6); }
  
  .auth-btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: var(--color); color: #fff; font-size: 1.2rem; font-weight: bold;
    cursor: pointer; transition: all 0.3s; font-family: 'Cairo', sans-serif;
    box-shadow: 0 4px 15px rgba(var(--color-rgb), 0.4), inset 0 2px 2px rgba(255,255,255,0.2);
  }
  .auth-btn:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(var(--color-rgb), 0.6); }
  
  .auth-error { color: #ef4444; text-align: center; margin-top: 15px; font-size: 1rem; display: none; font-weight: 600; font-family: 'Cairo', sans-serif;}
  .close-modal {
    position: absolute; top: 20px; right: 20px; color: #94a3b8;
    background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: color 0.3s;
  }
  .close-modal:hover { color: #fff; }
  .dynamic-silo-name {
    position: absolute;
    top: 6.5%; 
    left: 35%;
    right: 35%;
    height: 9.5%; /* Taller to cover the 3D bottom of the old text */
    display: flex;
    align-items: center;
    justify-content: center;
    
    /* Solid patch exactly over the old text, no shadow bleeding */
    background: #111a28; 
    border-radius: 8px;
    
    color: #ffffff;
    font-size: clamp(1.4rem, 2vw, 2.2rem); /* Even smaller to fit nicely */
    font-weight: 800;
    text-shadow: 0px 4px 10px rgba(0,0,0,0.8);
    z-index: 10;
    letter-spacing: 1px;
  }

  /* Golden Wheat Decorations */
  .decor-wheat {
    position: absolute;
    color: #eab308;
    font-size: 8rem;
    filter: drop-shadow(0 0 15px rgba(234,179,8,0.5)) drop-shadow(2px 4px 6px rgba(0,0,0,0.8));
    opacity: 0.85;
    pointer-events: none;
    z-index: 1;
  }
  .decor-wheat.top-left { top: -40px; left: -40px; transform: rotate(-45deg); font-size: 10rem; }
  .decor-wheat.top-right { top: -40px; right: -40px; transform: rotate(45deg) scaleX(-1); font-size: 10rem; }
  .decor-wheat.bottom-left { bottom: -40px; left: -40px; transform: rotate(-135deg) scaleX(-1); font-size: 10rem; }
  .decor-wheat.bottom-right { bottom: -40px; right: 25%; transform: rotate(145deg); font-size: 8rem; }
  
  .glow-speck {
    position: absolute;
    width: 6px; height: 6px;
    background: #fef08a;
    border-radius: 50%;
    box-shadow: 0 0 15px 5px rgba(234,179,8,0.7);
    pointer-events: none;
    z-index: 1;
  }
  .glow-speck.s1 { top: 20%; left: 15%; }
  .glow-speck.s2 { top: 30%; right: 20%; width: 4px; height: 4px; box-shadow: 0 0 10px 4px rgba(234,179,8,0.6); }
  .glow-speck.s3 { bottom: 25%; left: 35%; }
  .glow-speck.s4 { bottom: 15%; right: 10%; }
  
  .accent-wheat {
    position: absolute;
    color: #eab308;
    font-size: 2.5rem;
    filter: drop-shadow(0 0 8px rgba(234,179,8,0.6)) drop-shadow(1px 2px 3px rgba(0,0,0,0.8));
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 0;
  }
  .accent-wheat.left { left: 15px; transform: translateY(-50%) rotate(-30deg); }
  .accent-wheat.right { right: 15px; transform: translateY(-50%) rotate(30deg) scaleX(-1); }
  
  .portal-icon { position: relative; z-index: 2; }

</style>
</head>
<body class="portal-page">

<div class="image-map-container">
  <img src="../img/portal_bg.jpg" alt="Portal Background" class="bg-image">
  
  <div class="dynamic-silo-name" id="dynamicSiloName"></div>
  
  <!-- Clickable Overlay Areas -->
  <div class="click-area area-finance" onclick="openAuth('finance', 'الشئون المالية', 'fa-money-bill-wave', '#10b981')" title="الشئون المالية"></div>
  <div class="click-area area-security" onclick="openAuth('security', 'إدارة الأمن', 'fa-shield-halved', '#ef4444')" title="إدارة الأمن"></div>
  <div class="click-area area-reception" onclick="openAuth('scale', 'إدارة الاستلام والتخزين', 'fa-scale-balanced', '#3b82f6')" title="إدارة الاستلام والتخزين"></div>
  <div class="click-area area-manager" onclick="openAuth('manager', 'مدير الموقع', 'fa-user-tie', '#8b5cf6')" title="مدير الموقع"></div>
  <div class="click-area area-maintenance" onclick="openAuth('maintenance', 'الصيانة', 'fa-wrench', '#f59e0b')" title="الصيانة"></div>

  <div class="settings-btn" onclick="openSettingsAuth()" style="position:fixed;bottom:20px;right:20px;background:rgba(255,255,255,0.1);color:#fff;border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 4px 15px rgba(0,0,0,0.5);transition:all 0.3s;" title="إعدادات الموقع">
    <i class="fa-solid fa-gear" style="font-size:24px;"></i>
  </div>

  <div class="auth-modal-overlay" id="settingsModal">
    <div class="auth-modal" style="--color:#8b5cf6; --color-rgb:139,92,246">
      <button class="close-modal" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
      <div class="auth-modal-header">
        <div class="auth-modal-icon"><i class="fa-solid fa-sliders"></i></div>
        <h2>إعدادات كلمات المرور</h2>
      </div>
      <div style="padding:20px; text-align:right">
        <div class="auth-form-group">
          <label style="color:#fff; margin-bottom:5px; display:block">كلمة مرور البوابة</label>
          <input type="password" id="setPwdSecurity" class="auth-input">
        </div>
        <div class="auth-form-group">
          <label style="color:#fff; margin-bottom:5px; display:block">كلمة مرور الميزان</label>
          <input type="password" id="setPwdScale" class="auth-input">
        </div>
        <div class="auth-form-group">
          <label style="color:#fff; margin-bottom:5px; display:block">كلمة مرور الإدارة</label>
          <input type="password" id="setPwdManager" class="auth-input">
        </div>
        <button type="button" class="auth-btn" style="background:#8b5cf6" onclick="saveSettings()">حفظ الإعدادات</button>
      </div>
    </div>
  </div>
  </div>

  <!-- Auth Modal -->
<div class="auth-modal-overlay" id="authModal">
  <div class="auth-modal" id="modalContent">
    <button class="close-modal" onclick="closeAuth()"><i class="fa-solid fa-xmark"></i></button>
    <div class="auth-modal-header">
      <div class="auth-modal-icon" id="modalIcon"><i class="fa-solid fa-lock"></i></div>
      <h2 id="modalTitle">تأكيد الدخول</h2>
    </div>
    <form onsubmit="handleDeptLogin(event)">
      <div class="auth-form-group">
        <input type="password" id="deptPassword" class="auth-input" placeholder="كلمة المرور" required autofocus autocomplete="off">
      </div>
      <button type="submit" class="auth-btn" id="modalBtn">تأكيد الدخول</button>
      <div class="auth-error" id="modalError">كلمة المرور غير صحيحة</div>
    </form>
  </div>
</div>

<script src="../js/data.js?v=18"></script>
<script src="../js/app.js?v=18"></script>
<script>
  const currentUser = Auth.current();
  if (!currentUser || currentUser.role !== 'silo') {
    window.location.href = '../index.html';
  } else {
    document.getElementById('dynamicSiloName').textContent = currentUser.name;
  }

  let selectedRole = '';
  let isSettingsAuth = false;

  function openSettingsAuth() {
    isSettingsAuth = true;
    openAuth('manager', 'إعدادات الموقع', 'fa-gear', '#8b5cf6');
  }

  function openSettingsPanel() {
    document.getElementById('settingsModal').classList.add('active');
    const customPasswords = JSON.parse(localStorage.getItem('SILO_PASSWORDS') || '{}');
    const siloId = currentUser.silo_id;
    document.getElementById('setPwdSecurity').value = customPasswords[siloId + '_security'] || '123';
    document.getElementById('setPwdScale').value = customPasswords[siloId + '_scale'] || '123';
    document.getElementById('setPwdManager').value = customPasswords[siloId + '_manager'] || '123';
  }

  function closeSettings() {
    document.getElementById('settingsModal').classList.remove('active');
  }

  function saveSettings() {
    const customPasswords = JSON.parse(localStorage.getItem('SILO_PASSWORDS') || '{}');
    const siloId = currentUser.silo_id;
    customPasswords[siloId + '_security'] = document.getElementById('setPwdSecurity').value;
    customPasswords[siloId + '_scale'] = document.getElementById('setPwdScale').value;
    customPasswords[siloId + '_manager'] = document.getElementById('setPwdManager').value;
    localStorage.setItem('SILO_PASSWORDS', JSON.stringify(customPasswords));
    showToast('تم حفظ إعدادات كلمات المرور بنجاح', 'success');
    closeSettings();
  }

  function openAuth(role, title, iconClass, color) {
    selectedRole = role;
    
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
    document.getElementById('modalContent').style.setProperty('--color', color);
    
    // Extract RGB for drop shadows
    const hex = color.replace('#', '');
    const r = parseInt(hex.substring(0, 2), 16);
    const g = parseInt(hex.substring(2, 4), 16);
    const b = parseInt(hex.substring(4, 6), 16);
    document.getElementById('modalContent').style.setProperty('--color-rgb', `${r},${g},${b}`);
    
    document.getElementById('modalBtn').style.background = color;
    
    document.getElementById('deptPassword').value = '';
    document.getElementById('modalError').style.display = 'none';
    
    document.getElementById('authModal').classList.add('active');
    setTimeout(() => document.getElementById('deptPassword').focus(), 100);
  }

  function closeAuth() {
    document.getElementById('authModal').classList.remove('active');
  }

  function handleDeptLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('modalBtn');
    const pwd = document.getElementById('deptPassword').value;
    
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
    btn.disabled = true;

    setTimeout(() => {
      try {
        const siloId = currentUser.silo_id;
        const deptUser = Auth.loginByRole(selectedRole, siloId, pwd);
        
        if (deptUser) {
          if (isSettingsAuth) { isSettingsAuth = false; closeAuth(); openSettingsPanel(); }
            else if (selectedRole === 'scale') window.location.href = 'reception.html?v=19';
          else if (selectedRole === 'security') window.location.href = 'security.html?v=19';
          else if (selectedRole === 'finance') window.location.href = 'finance.html?v=19';
          else if (selectedRole === 'maintenance') window.location.href = 'maintenance.html?v=19';
          else window.location.href = 'dashboard.html?v=19';
        } else {
          document.getElementById('modalError').style.display = 'block';
          btn.innerHTML = 'تأكيد الدخول';
          btn.disabled = false;
        }
      } catch (err) {
        alert("حدث خطأ: " + err.message);
        btn.innerHTML = 'خطأ بالنظام';
        console.error(err);
      }
    }, 600);
  }
</script>
</body>
</html>
